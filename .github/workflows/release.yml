name: Build & Publish AuraOS Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 4.3.0)"
        required: true
        default: "4.3.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $raw = if ("${{ github.event.inputs.version }}" -ne "") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          $clean = $raw.TrimStart('v', 'V')
          echo "version=$clean" >> $env:GITHUB_OUTPUT
          echo "tag=v$clean" >> $env:GITHUB_OUTPUT

      - name: Compile AuraOS Suite (7 Pure-Rust binaries + AuraShell-Setup.exe)
        shell: pwsh
        run: |
          .\build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Package Release ZIP + latest.json manifest
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path dist\pkg | Out-Null
          $files = @(
            "AuraShell.exe", "AuraFiles.exe", "AuraPhotos.exe", "AuraPlayer.exe",
            "AuraNotes.exe", "AuraLock.exe", "AuraSettings.exe", "AuraTasks.exe", "AuraShell-Setup.exe",
            "AuraShell.ico", "AuraFiles.ico", "AuraShell_256.png", "AuraFiles_256.png",
            "restore-windows.ps1", "APBOptimizer.ps1", "version.json"
          )
          foreach ($f in $files) {
            if (Test-Path $f) { Copy-Item $f "dist\pkg\$f" -Force }
          }
          $zipName = "AuraOS-v$v-Windows-x64.zip"
          Compress-Archive -Path "dist\pkg\*" -DestinationPath "dist\$zipName" -Force
          Copy-Item "AuraShell-Setup.exe" "dist\AuraShell-Setup.exe" -Force

          $hash = (Get-FileHash "dist\$zipName" -Algorithm SHA256).Hash
          $repo = "${{ github.repository }}"
          $manifest = [ordered]@{
            Version = $v
            BuildNumber = [int64](Get-Date -Format "yyyyMMddHHmm")
            DownloadUrl = "https://github.com/$repo/releases/download/$tag/$zipName"
            SetupUrl = "https://github.com/$repo/releases/download/$tag/AuraShell-Setup.exe"
            Sha256 = $hash
            Changelog = "AuraOS v$v — Suite 100% Pure-Rust Direct2D (AuraShell, AuraSettings, AuraLock, AuraTasks, AuraFiles, AuraPhotos, AuraPlayer, AuraNotes)."
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD "dist\latest.json"), ($manifest | ConvertTo-Json -Depth 4), $utf8NoBom)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "AuraOS ${{ steps.ver.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/AuraOS-v*-Windows-x64.zip
            dist/AuraShell-Setup.exe
            dist/latest.json
