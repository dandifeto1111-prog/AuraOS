name: Build & Publish AuraOS Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 5.4.0)"
        required: true
        default: "5.4.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $raw = if ("${{ github.event.inputs.version }}" -ne "") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          $clean = $raw.TrimStart('v', 'V')
          echo "version=$clean" >> $env:GITHUB_OUTPUT
          echo "tag=v$clean" >> $env:GITHUB_OUTPUT

      - name: Compile AuraOS Suite (11 Pure-Rust binaries + AuraShell-Setup.exe)
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Package Organized Release ZIP + latest.json manifest
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path dist\pkg\app | Out-Null

          # Keep the extracted package spotless: ONLY AuraShell-Setup.exe at root, all payload inside app/
          Copy-Item "AuraShell-Setup.exe" "dist\pkg\AuraShell-Setup.exe" -Force
          Copy-Item "AuraShell-Setup.exe" "dist\AuraShell-Setup.exe" -Force
          Copy-Item "app\*" "dist\pkg\app\" -Recurse -Force

          $zipName = "AuraOS-v$v-Windows-x64.zip"
          Compress-Archive -Path "dist\pkg\*" -DestinationPath "dist\$zipName" -Force

          $hash = (Get-FileHash "dist\$zipName" -Algorithm SHA256).Hash
          $repo = "${{ github.repository }}"
          $manifest = [ordered]@{
            Version = $v
            BuildNumber = [int64](Get-Date -Format "yyyyMMddHHmm")
            DownloadUrl = "https://github.com/$repo/releases/download/$tag/$zipName"
            SetupUrl = "https://github.com/$repo/releases/download/$tag/AuraShell-Setup.exe"
            Sha256 = $hash
            Changelog = "AuraOS v$v - Nuevo fondo animado por defecto Gradient Waves estilo React Bits (Ocean, Dune, Dusk, Silk, Aurora) con cambio de color en 1 clic, sliders de velocidad/relieve y adaptacion de color Material You 3 en tiempo real para toda la suite."
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD "dist\latest.json"), ($manifest | ConvertTo-Json -Depth 4), $utf8NoBom)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "AuraOS ${{ steps.ver.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/AuraOS-v*-Windows-x64.zip
            dist/AuraShell-Setup.exe
            dist/latest.json
